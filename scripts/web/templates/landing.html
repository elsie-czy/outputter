<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>火花 - AI驱动的内容创作平台</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css', v='20260709-portal-clean-bg') }}" />
</head>
<body>
  <main class="portal">
    <header class="portal-nav" aria-label="门户导航">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <strong>火花</strong>
          <small>拆解好书，输出价值</small>
        </span>
      </a>

      <nav class="nav-links" aria-label="主要导航">
        <a href="/dashboard">产品</a>
        <a href="#features">功能介绍</a>
        <a href="#templates">模板中心</a>
        <a href="#materials">素材中心</a>
        <a href="#pricing">价格</a>
        <a href="#help">帮助中心</a>
      </nav>

      <div class="nav-actions">
        <a class="btn btn-ghost" href="/dashboard">用户登录</a>
        <a class="btn btn-outline" href="/production-center">管理员登录</a>
        <a class="btn btn-primary" href="/dashboard">免费体验</a>
      </div>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-bg" aria-hidden="true">
        <video autoplay muted loop playsinline preload="auto">
          <source src="{{ url_for('static', filename='video/portal-hero-loop.mp4', v='20260709-clean2') }}" type="video/mp4" />
        </video>
      </div>

      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow">
            <span aria-hidden="true">✦</span>
            AI 赋能拆书 · 内容创作 · 账号运营
          </p>

          <h1 id="hero-title">AI驱动的<span>内容创作平台</span></h1>
          <p class="hero-subtitle">
            拆透网文与经典著作，提炼核心观点与金句，<br />
            一键生成小红书图文笔记，辅助账号运营。
          </p>

          <div class="hero-actions">
            <a class="cta cta-primary" href="/dashboard">
              免费体验
              <span aria-hidden="true">→</span>
            </a>
            <a class="cta cta-secondary" href="/deconstruct">
              <span class="play-icon" aria-hidden="true">▷</span>
              查看演示
            </a>
          </div>

          <div class="feature-strip" id="features">
            <article class="feature-card">
              <span class="feature-icon"><i data-lucide="scan-search"></i></span>
              <div>
                <h2>智能拆解</h2>
                <p>AI 深度精析书籍</p>
              </div>
            </article>
            <article class="feature-card">
              <span class="feature-icon"><i data-lucide="check-check"></i></span>
              <div>
                <h2>一键成稿</h2>
                <p>快速生成优质笔记</p>
              </div>
            </article>
            <article class="feature-card">
              <span class="feature-icon"><i data-lucide="image-plus"></i></span>
              <div>
                <h2>配图生成</h2>
                <p>匹配风格高质素材</p>
              </div>
            </article>
            <article class="feature-card">
              <span class="feature-icon"><i data-lucide="trending-up"></i></span>
              <div>
                <h2>账号运营</h2>
                <p>数据驱动持续增长</p>
              </div>
            </article>
          </div>
        </div>
      </div>

    </section>

    <div class="sr-only" id="templates">模板中心</div>
    <div class="sr-only" id="materials">素材中心</div>
    <div class="sr-only" id="pricing">价格</div>
    <div class="sr-only" id="help">帮助中心</div>
  </main>
  <script>
    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>
</body>
</html>
