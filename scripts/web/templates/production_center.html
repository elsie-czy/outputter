{% extends "base.html" %}

{% block title %}生产中心 - 超级工具{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/production_center.css') }}" />
{% endblock %}

{% block content %}
<div class="pc-container">

  <!-- ===== 顶部任务统计栏 ===== -->
  <div class="pc-stats-row">
    <div class="pc-stat-card pc-stat-card--hero">
      <div class="pc-stat-icon">
        <i data-lucide="box"></i>
      </div>
      <div class="pc-stat-info">
        <div class="pc-stat-value" id="statTotalDone">0</div>
        <div class="pc-stat-label">已审核任务</div>
      </div>
    </div>
    <div class="pc-stat-card pc-stat-card--processing">
      <div class="pc-stat-icon">
        <i data-lucide="loader"></i>
      </div>
      <div class="pc-stat-info">
        <div class="pc-stat-value" id="statProcessing">0</div>
        <div class="pc-stat-label">生产中</div>
      </div>
    </div>
    <div class="pc-stat-card pc-stat-card--review">
      <div class="pc-stat-icon">
        <i data-lucide="clipboard-check"></i>
      </div>
      <div class="pc-stat-info">
        <div class="pc-stat-value" id="statReview">0</div>
        <div class="pc-stat-label">待审核</div>
      </div>
    </div>
    <div class="pc-stat-card pc-stat-card--pending">
      <div class="pc-stat-icon">
        <i data-lucide="clock"></i>
      </div>
      <div class="pc-stat-info">
        <div class="pc-stat-value" id="statPending">0</div>
        <div class="pc-stat-label">等待中</div>
      </div>
    </div>
    <div class="pc-stat-card pc-stat-card--failed">
      <div class="pc-stat-icon">
        <i data-lucide="x-circle"></i>
      </div>
      <div class="pc-stat-info">
        <div class="pc-stat-value" id="statFailed">0</div>
        <div class="pc-stat-label">今日失败</div>
      </div>
    </div>
  </div>

  <!-- ===== Tab 状态筛选 ===== -->
  <div class="pc-tabs">
    <button class="pc-tab active" data-status="">全部 <span id="tabAllCount">0</span></button>
    <button class="pc-tab" data-status="deconstructing,generating_note,ai_scoring,generating_image">生产中 <span id="tabProcessingCount">0</span></button>
    <button class="pc-tab" data-status="waiting,paused">等待中 <span id="tabPendingCount">0</span></button>
    <button class="pc-tab" data-status="human_review">待审核 <span id="tabReviewCount">0</span></button>
    <button class="pc-tab" data-status="done">已审核 <span id="tabDoneCount">0</span></button>
    <button class="pc-tab" data-status="failed,cancelled">失败 <span id="tabFailedCount">0</span></button>
  </div>

  <!-- ===== 筛选器区域 ===== -->
  <div class="pc-filter-bar">
    <label class="pc-search-wrap" for="pcSearch">
      <i data-lucide="search"></i>
      <input type="text" id="pcSearch" class="pc-search-input" placeholder="搜索作品名 / 作者 / 任务ID" />
    </label>
    <select id="pcModel" class="pc-select" aria-label="模型筛选">
      <option value="">全部模型</option>
      <option value="glm">拆文-GLM4</option>
      <option value="qwen">笔记-Qwen</option>
    </select>
    <select id="pcCategory" class="pc-select" aria-label="分类筛选">
      <option value="">全部分类</option>
      <option value="都市">都市</option>
      <option value="玄幻">玄幻</option>
      <option value="言情">言情</option>
    </select>
    <select id="pcStage" class="pc-select" aria-label="阶段筛选">
      <option value="">全部阶段</option>
      <option value="waiting">等待中</option>
      <option value="deconstructing">拆文中</option>
      <option value="generating_note">生成笔记</option>
      <option value="ai_scoring">AI评分</option>
      <option value="human_review">待审核</option>
      <option value="generating_image">生成图片</option>
      <option value="done">已审核</option>
      <option value="failed">失败</option>
    </select>
    <button class="pc-filter-btn pc-filter-btn--reset" id="pcResetBtn">重置</button>
    <div class="pc-filter-right">
      <div class="pc-batch-dropdown">
        <button class="pc-batch-btn" id="pcBatchBtn" disabled>
          <i data-lucide="more-horizontal"></i>
          批量操作
        </button>
        <div class="pc-batch-menu" id="pcBatchMenu">
          <button class="pc-batch-menu-item" data-action="pause">批量暂停</button>
          <button class="pc-batch-menu-item" data-action="retry">批量重试</button>
          <button class="pc-batch-menu-item" data-action="cancel">批量终止</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 任务列表 ===== -->
  <div class="pc-table-wrapper">
    <table class="pc-table" id="pcTable">
      <thead>
        <tr>
          <th class="pc-th-check"><input type="checkbox" id="pcSelectAll" /></th>
          <th class="pc-th-cover">封面</th>
          <th class="pc-th-info">作品信息</th>
          <th class="pc-th-progress">进度</th>
          <th class="pc-th-stage">当前阶段</th>
          <th class="pc-th-model">模型与配置</th>
          <th class="pc-th-time">创建时间</th>
          <th class="pc-th-actions">操作</th>
        </tr>
      </thead>
      <tbody id="pcTableBody">
        <tr class="pc-loading">
          <td colspan="8">加载中...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ===== 分页 + 资源监控 ===== -->
  <div class="pc-footer">
    <div class="pc-resource-monitor">
      <span class="pc-resource-item">
        <i data-lucide="zap"></i>
        今日Token: <strong id="tokenUsed">0</strong> / <span id="tokenBudget">500万</span>
      </span>
      <span class="pc-resource-item">
        <i data-lucide="clock"></i>
        预计剩余: <strong id="estRemain">—</strong>
      </span>
      <span class="pc-resource-item">
        <i data-lucide="file-text"></i>
        今日产出: <strong id="todayOutput">0</strong>份
      </span>
    </div>
    <div class="pc-pagination" id="pcPagination"></div>
  </div>

</div>

<!-- 操作确认弹窗 -->
<div class="pc-modal-overlay" id="pcModalOverlay">
  <div class="pc-modal">
    <div class="pc-modal-title" id="pcModalTitle">确认操作</div>
    <div class="pc-modal-body" id="pcModalBody"></div>
    <div class="pc-modal-actions">
      <button class="pc-modal-cancel" id="pcModalCancel">取消</button>
      <button class="pc-modal-confirm" id="pcModalConfirm">确认</button>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/production_center.js') }}"></script>
{% endblock %}
