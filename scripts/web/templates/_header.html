{# Header 组件 — 固定顶部 64px #}
<header class="app-header">
  <div class="app-header-left">
    <button class="app-sidebar-toggle" id="sidebarToggle" aria-label="切换侧边栏">
      <span class="app-sidebar-toggle-icon">&#x2630;</span>
    </button>
    <a href="/" class="app-header-logo">
      <span class="app-header-logo-icon">&#x1F4DD;</span>
      <span class="app-header-logo-text">超级工具</span>
    </a>
  </div>

  <div class="app-header-center">
    <span class="app-header-page-title">{{ page_title|default("") }}</span>
  </div>

  <div class="app-header-right">
    <button class="app-header-icon-btn" aria-label="通知">
      &#x1F514;
      <span class="app-header-badge">3</span>
    </button>
    <button class="app-header-icon-btn" aria-label="帮助">
      &#x2753;
    </button>
    <div class="app-header-user">
      <div class="app-header-avatar">&#x1F464;</div>
      <span class="app-header-username">运营-小明</span>
    </div>
  </div>
</header>
