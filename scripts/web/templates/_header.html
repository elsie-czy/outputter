{# Header 组件 — 固定顶部 64px #}
<header class="app-header{% if header_back_href %} app-header--contextual{% endif %}">
  <div class="app-header-left">
    <a href="/" class="app-header-logo">
      <i data-lucide="file-text" class="app-header-logo-icon"></i>
      <span class="app-header-logo-text">超级工具</span>
    </a>
    {% if header_back_href %}
    <a href="{{ header_back_href }}" class="app-header-back">
      <i data-lucide="arrow-left"></i>
      <span>{{ header_back_text|default("返回") }}</span>
    </a>
    <span class="app-header-context-title">{{ page_title|default("") }}</span>
    {% if header_badge %}
    <span class="app-header-context-badge">{{ header_badge }}</span>
    {% endif %}
    {% elif page_title %}
    <span class="app-header-page-title">{{ page_title }}</span>
    {% endif %}
  </div>

  <div class="app-header-center"></div>

  <div class="app-header-right">
    <div class="app-header-account" id="accountStrategySwitcher" title="当前工作台服务账号">
      <i data-lucide="badge-check"></i>
      <div class="app-header-account-copy">
        <span>服务账号</span>
        <strong id="accountStrategyName">加载中</strong>
      </div>
      <select id="accountStrategySelect" aria-label="选择当前服务账号"></select>
    </div>

    <!-- Worker 状态指示器 -->
    <div class="app-header-worker" id="workerStatus">
      <span class="worker-dot worker-dot--stopped"></span>
      <span class="worker-name">Worker</span>
      <button class="worker-restart-btn" id="workerRestartBtn" title="重启 Worker">
        <i data-lucide="refresh-cw"></i>
      </button>
    </div>
    
    <button class="app-header-icon-btn" aria-label="通知">
      <i data-lucide="bell"></i>
      <span class="app-header-badge">3</span>
    </button>
    <button class="app-header-icon-btn" aria-label="帮助">
      <i data-lucide="circle-help"></i>
    </button>
    <div class="app-header-user">
      <div class="app-header-avatar">
        <i data-lucide="user"></i>
      </div>
      <span class="app-header-username">运营-小明</span>
    </div>
  </div>
</header>
