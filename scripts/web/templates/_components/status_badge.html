{% macro status_badge(status, text=None) %}
  {% set labels = {
    "pending": "排队中",
    "processing": "处理中",
    "done": "已完成",
    "failed": "失败",
    "retry": "重试中"
  } %}
  {% set status_key = status|default("pending") %}
  {% set label = text|default(labels.get(status_key, "未知")) %}
  <span class="status-badge status-{{ status_key }}">
    <span class="status-dot"></span>
    {{ label }}
  </span>
{% endmacro %}
