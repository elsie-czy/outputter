services:
  web:
    build: .
    container_name: personal-supertool-web
    env_file:
      - .env
    environment:
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8101"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: >
      gunicorn -w 2 -b 0.0.0.0:8101 scripts.web_app:app
    ports:
      - "8080:8101"
    volumes:
      - ./logs:/app/logs
      - ./outputs:/app/outputs
      - ./data:/app/data
    restart: unless-stopped

  image-worker:
    build: .
    container_name: personal-supertool-image-worker
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: >
      python scripts/jimeng_worker.py jobs
    volumes:
      - ./logs:/app/logs
      - ./outputs:/app/outputs
      - ./data:/app/data
    restart: unless-stopped
    profiles:
      - worker

  deconstruct-runner:
    build: .
    container_name: personal-supertool-runner
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: >
      python scripts/deconstruct_worker.py
    volumes:
      - ./logs:/app/logs
      - ./outputs:/app/outputs
      - ./data:/app/data
    restart: unless-stopped
